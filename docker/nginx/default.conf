# ==============================================================================
# HTTP Server (Port 80)
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Support wildcard tenant subdomains, base patterns, and custom domains
    server_name _ *.erp.test erp.test localhost *.brixelltd.com ~^[a-zA-Z0-9_-]+-erp\.brixelltd\.com$;

    root /var/www/erp/public;
    index index.php index.html;

    client_max_body_size 64M;

    # WebSocket proxy → Reverb
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Reverb HTTP endpoints (auth, etc.)
    location /reverb/ {
        proxy_pass http://reverb:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $host;
    }

    location ~ /\.ht {
        deny all;
    }
}

# ==============================================================================
# HTTPS Server (Port 443) - Multi-Tenant Wildcard SSL
# ==============================================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Support wildcard tenant subdomains, base patterns, and custom domains
    server_name _ *.erp.test erp.test localhost *.brixelltd.com ~^[a-zA-Z0-9_-]+-erp\.brixelltd\.com$;

    root /var/www/erp/public;
    index index.php index.html;

    client_max_body_size 64M;

    # Universal & Wildcard SSL Certificates
    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Response Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket proxy → Reverb
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Reverb HTTP endpoints (auth, etc.)
    location /reverb/ {
        proxy_pass http://reverb:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS on;
    }

    location ~ /\.ht {
        deny all;
    }
}
